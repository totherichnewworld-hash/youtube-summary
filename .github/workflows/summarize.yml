name: Summarize new subscriptions

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC); adjust as you like
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      initial:
        description: "On first run, summarize the N newest items per feed"
        required: false
        default: "0"

concurrency:
  group: summarize
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit state.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run summarizer
        env:
          # Summarization backend: 'anthropic' (default) or 'openai'
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # For LLM_PROVIDER=openai (OpenAI, a gateway, or a hosted local model)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          # Transcription (set whichever provider you use)
          TRANSCRIBER: ${{ vars.TRANSCRIBER || 'deepgram' }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          # Email delivery (SMTP)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python run.py --initial "${{ github.event.inputs.initial || '0' }}"

      - name: Persist state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update summary state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
