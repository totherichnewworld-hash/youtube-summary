name: Summarize new subscriptions

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC); adjust as you like
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      backfill:
        description: "Summarize the N newest PAST videos per channel now (e.g. 5). Use this to catch up on the backlog."
        required: false
        default: "0"
      all_history:
        description: "Summarize EVERY past video of each channel (the full backlog, via yt-dlp). Combine with 'max_per_run'."
        type: boolean
        required: false
        default: false
      max_per_run:
        description: "Cap items processed per run (e.g. 10) so a big backlog spreads across runs. 0 = no limit."
        required: false
        default: "0"
      initial:
        description: "On first run only, summarize the N newest items per feed"
        required: false
        default: "0"
      max_tokens:
        description: "Summary length (output token budget). Bigger = longer. Leave blank to use the repo default."
        required: false
        default: ""

concurrency:
  group: summarize
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit state.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run summarizer
        env:
          # Summarization backend: 'anthropic' (default) or 'openai'
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          # Summary length. A manual run's box wins; otherwise the repo Variable;
          # otherwise the code default (4096). Set vars.SUMMARY_MAX_TOKENS once
          # in Settings -> Secrets and variables -> Actions -> Variables.
          SUMMARY_MAX_TOKENS: ${{ github.event.inputs.max_tokens || vars.SUMMARY_MAX_TOKENS }}
          # Save full transcripts to transcripts/ (committed below). Set the repo
          # Variable SAVE_TRANSCRIPTS to 'false' to turn this off.
          SAVE_TRANSCRIPTS: ${{ vars.SAVE_TRANSCRIPTS || 'true' }}
          # Write a summary? Set MAKE_SUMMARY=false for transcript-only.
          MAKE_SUMMARY: ${{ vars.MAKE_SUMMARY || 'true' }}
          # Clean up the transcript for readability with the LLM (uses more
          # tokens). Set CORRECT_TRANSCRIPT=true to turn on.
          CORRECT_TRANSCRIPT: ${{ vars.CORRECT_TRANSCRIPT || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # For LLM_PROVIDER=openai (OpenAI, a gateway, or a hosted local model)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          # Transcription (set whichever provider you use)
          TRANSCRIBER: ${{ vars.TRANSCRIBER || 'deepgram' }}
          # Optional: force a transcription language (e.g. zh). Unset = auto-detect.
          TRANSCRIBE_LANGUAGE: ${{ vars.TRANSCRIBE_LANGUAGE }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          # Proxy for YouTube (optional) — lets the cloud runner reach YouTube,
          # which blocks datacenter IPs. Use a RESIDENTIAL proxy; datacenter/free
          # ones are blocked too. Webshare is what youtube-transcript-api
          # recommends; or set YT_PROXY to a generic http://user:pass@host:port.
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
          # Email delivery (SMTP) — optional
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Discord delivery (webhook URL) — optional
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # --all-history flag is added below only when the input is true.
          ALL_HISTORY: ${{ github.event.inputs.all_history || 'false' }}
        run: >
          python run.py
          --initial "${{ github.event.inputs.initial || '0' }}"
          --backfill "${{ github.event.inputs.backfill || '0' }}"
          --max-per-run "${{ github.event.inputs.max_per_run || '0' }}"

      - name: Persist state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -d summaries ]; then git add summaries; fi
          if [ -d transcripts ]; then git add transcripts; fi
          if [ -f SUMMARIES.md ]; then git add SUMMARIES.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update summaries, transcripts and state [skip ci]"
            git push
          else
            echo "Nothing to commit."
          fi
